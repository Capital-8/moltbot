name: Android build-only Gradle profile

run-name: Android four/eight CPU comparison (60b52d9d21d1)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PROFILE_SOURCE_SHA: 60b52d9d21d13599c7abd4851e9cdbf4532e3445

jobs:
  profile:
    name: ${{ matrix.variant }} sample ${{ matrix.sample }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sample: [1, 2, 3]
        variant: [github-four-cpu, blacksmith-eight-cpu]
        include:
          - variant: github-four-cpu
            runner: ubuntu-24.04
            cpus: 4
          - variant: blacksmith-eight-cpu
            runner: blacksmith-32vcpu-ubuntu-2404
            cpus: 8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve diagnostic driver outside production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          install -m 700 scripts/android-gradle-build-profile.py "$RUNNER_TEMP/android-gradle-build-profile.py"

      - name: Checkout exact production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROFILE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "true"
          node-version: "24.22.1"

      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: off
          install-screenshot-emulators: "false"

      - name: Profile signing validation and phone/Wear bundle build
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/android-profile-gradle-home
          PROFILE_OUTPUT: ${{ runner.temp }}/android-gradle-profile
          PROFILE_EXPECTED_CPUS: ${{ matrix.cpus }}
          PROFILE_VARIANT: ${{ matrix.variant }}
          PROFILE_SAMPLE: ${{ matrix.sample }}
          PROFILE_RUNNER_LABEL: ${{ matrix.runner }}
        run: python3 "$RUNNER_TEMP/android-gradle-build-profile.py"

      - name: Retain local Gradle profiles and resource evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-gradle-profile-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/android-gradle-profile
          if-no-files-found: error
          retention-days: 14
