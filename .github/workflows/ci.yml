name: CI
run-name: iOS cold boot screening (${{ inputs.runner }}, no app or upload)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Existing hosted Xcode 27 runner to screen
        type: choice
        required: true
        default: xcode-27-xlarge
        options:
          - xcode-27-xlarge
          - xcode-27
permissions:
  contents: read
concurrency:
  group: diagnostic-ios-startup-contention
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  ios-startup-contention:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Measure one fresh iPhone boot without OpenClaw or XCTest
        env:
          PROBE_RUNNER_LABEL: ${{ inputs.runner }}
        run: node scripts/ios-startup-contention-probe.mjs "$RUNNER_TEMP/ios-startup-contention.jsonl"
      - name: Retain sanitized phase timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-startup-contention-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-startup-contention.jsonl
          if-no-files-found: error
          retention-days: 14
