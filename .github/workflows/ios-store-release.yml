name: iOS Source Packages performance proof
run-name: Nonpublishing iOS source package comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-source-packages-proof
  cancel-in-progress: false
jobs:
  compare:
    runs-on: xcode-27-xlarge
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ACCEPTANCE_RULE: Five serial cold/warm pairs; restored resolve median at least 20% faster including cache transfer, p95 no worse, identical package identities and complete artifacts; one warm unsigned clean archive must succeed. No export or upload.
    steps:
      - name: Checkout pinned proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Xcode
        run: |
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          node-version: "24.22.1"
      - name: Prepare native tools
        run: |
          set -euo pipefail
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '\"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-release-libraries" >> "$GITHUB_ENV"
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        id: native
      - name: Restore verified Watch device libraries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}
      - name: Prepare canonical detached release project
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_dir="$RUNNER_TEMP/ios-release-recovery/source"
          mkdir -p "$(dirname "$source_dir")"
          git worktree add --detach "$source_dir" "$GITHUB_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$source_dir/node_modules"
          cd "$source_dir"
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          /bin/bash scripts/ios-release-prepare.sh --version "$version" --revision 0 --build-number 1 --team-id FWJYW4S8P8
          echo "XCODE_XCCONFIG_FILE=$source_dir/apps/ios/build/AppStoreRelease.xcconfig" >> "$GITHUB_ENV"
          node scripts/ios-source-packages-proof.mjs prepare
      - name: Reset task-owned package inputs cold 1
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Resolve cold 1
        run: node scripts/ios-source-packages-proof.mjs sample cold 1
      - name: Time cache producer
        run: echo "PRODUCER_STARTED_MS=$(node -p Date.now())" >> "$GITHUB_ENV"
      - name: Save diagnostic source package seed
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &packages ~/Library/Developer/Xcode/DerivedData/OpenClaw-*/SourcePackages
          key: &cache_key ios-source-packages-proof-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record cache producer cost
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/ios-source-packages-proof/cache-save.json", JSON.stringify({seconds: (Date.now() - Number(process.env.PRODUCER_STARTED_MS))/1000}))'
      - name: Reset task-owned package inputs warm 1
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Time restore 1
        run: echo "CACHE_RESTORE_STARTED_MS=$(node -p Date.now())" >> "$GITHUB_ENV"
      - name: Restore source package seed 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *packages
          key: *cache_key
          fail-on-cache-miss: true
      - name: Resolve restored 1
        run: |
          export OPENCLAW_IOS_SOURCE_PACKAGES_CACHE_SECONDS="$(node -p '(Date.now() - Number(process.env.CACHE_RESTORE_STARTED_MS))/1000')"
          node scripts/ios-source-packages-proof.mjs sample warm 1
      - name: Reset task-owned package inputs cold 2
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Resolve cold 2
        run: node scripts/ios-source-packages-proof.mjs sample cold 2
      - name: Reset task-owned package inputs warm 2
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Time restore 2
        run: echo "CACHE_RESTORE_STARTED_MS=$(node -p Date.now())" >> "$GITHUB_ENV"
      - name: Restore source package seed 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *packages
          key: *cache_key
          fail-on-cache-miss: true
      - name: Resolve restored 2
        run: |
          export OPENCLAW_IOS_SOURCE_PACKAGES_CACHE_SECONDS="$(node -p '(Date.now() - Number(process.env.CACHE_RESTORE_STARTED_MS))/1000')"
          node scripts/ios-source-packages-proof.mjs sample warm 2
      - name: Reset task-owned package inputs cold 3
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Resolve cold 3
        run: node scripts/ios-source-packages-proof.mjs sample cold 3
      - name: Reset task-owned package inputs warm 3
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Time restore 3
        run: echo "CACHE_RESTORE_STARTED_MS=$(node -p Date.now())" >> "$GITHUB_ENV"
      - name: Restore source package seed 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *packages
          key: *cache_key
          fail-on-cache-miss: true
      - name: Resolve restored 3
        run: |
          export OPENCLAW_IOS_SOURCE_PACKAGES_CACHE_SECONDS="$(node -p '(Date.now() - Number(process.env.CACHE_RESTORE_STARTED_MS))/1000')"
          node scripts/ios-source-packages-proof.mjs sample warm 3
      - name: Reset task-owned package inputs cold 4
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Resolve cold 4
        run: node scripts/ios-source-packages-proof.mjs sample cold 4
      - name: Reset task-owned package inputs warm 4
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Time restore 4
        run: echo "CACHE_RESTORE_STARTED_MS=$(node -p Date.now())" >> "$GITHUB_ENV"
      - name: Restore source package seed 4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *packages
          key: *cache_key
          fail-on-cache-miss: true
      - name: Resolve restored 4
        run: |
          export OPENCLAW_IOS_SOURCE_PACKAGES_CACHE_SECONDS="$(node -p '(Date.now() - Number(process.env.CACHE_RESTORE_STARTED_MS))/1000')"
          node scripts/ios-source-packages-proof.mjs sample warm 4
      - name: Reset task-owned package inputs cold 5
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Resolve cold 5
        run: node scripts/ios-source-packages-proof.mjs sample cold 5
      - name: Reset task-owned package inputs warm 5
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/OpenClaw-*
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -f "$RUNNER_TEMP/ios-release-recovery/source/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Time restore 5
        run: echo "CACHE_RESTORE_STARTED_MS=$(node -p Date.now())" >> "$GITHUB_ENV"
      - name: Restore source package seed 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *packages
          key: *cache_key
          fail-on-cache-miss: true
      - name: Resolve restored 5
        run: |
          export OPENCLAW_IOS_SOURCE_PACKAGES_CACHE_SECONDS="$(node -p '(Date.now() - Number(process.env.CACHE_RESTORE_STARTED_MS))/1000')"
          node scripts/ios-source-packages-proof.mjs sample warm 5
      - name: Evaluate package comparison
        run: node scripts/ios-source-packages-proof.mjs report
      - name: Consume restored packages in a clean unsigned archive
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/ios-release-recovery/source"
          rm -f "$source_dir/apps/ios/OpenClaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          xcodebuild -project "$source_dir/apps/ios/OpenClaw.xcodeproj" \
            -scheme OpenClaw -configuration Release -showBuildTimingSummary \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ios-source-packages-proof.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean archive \
            > "$RUNNER_TEMP/ios-source-packages-proof/unsigned-archive.log" 2>&1
          test -d "$RUNNER_TEMP/ios-source-packages-proof.xcarchive/Products/Applications/OpenClaw.app"
      - name: Retain performance proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-source-packages-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-source-packages-proof
          retention-days: 14
