name: CI
run-name: iOS startup CPU attribution (no app or upload)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-ios-startup-contention
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  ios-startup-contention:
    runs-on: xcode-27-xlarge
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Select Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
      - name: Observe one fresh iPhone boot without OpenClaw or XCTest
        run: |
          set -euo pipefail
          node scripts/ios-startup-contention-probe.mjs "$RUNNER_TEMP/ios-startup-contention.jsonl" scripts/ios-startup-powermetrics.py
      - name: Retain bounded sanitized counters
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-startup-contention-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-startup-contention.jsonl
          if-no-files-found: error
          retention-days: 14
