name: CI
run-name: iOS screenshot index-store preflight (no compilation or upload)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: diagnostic-ios-screenshot-compiler-index
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IOS_SCREENSHOT_NODE_VERSION: 24.22.1
  IOS_SCREENSHOT_XCODE_VERSION: Xcode 27.1 Build version 27A9275
jobs:
  index-store-preflight:
    runs-on: xcode-27-xlarge
    timeout-minutes: 30
    env:
      HISTORICAL_TARGET: "false"
    steps:
      - name: Checkout frozen diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout matching CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .ci-harness
          sparse-checkout: |-
            .github
            scripts
      - name: Select Xcode
        id: select-xcode
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
      - name: Setup Node environment
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
          node-version: ${{ env.IOS_SCREENSHOT_NODE_VERSION }}
      - name: Install pinned XcodeGen
        run: |-
          ./scripts/install-xcodegen.sh "$RUNNER_TEMP/openclaw-swift-tools"
          echo "$RUNNER_TEMP/openclaw-swift-tools" >> "$GITHUB_PATH"
      - name: Identify iOS native cache inputs
        id: ios-cache-inputs
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-libraries" >> "$GITHUB_ENV"
      - name: Restore screenshot source packages
        id: ios-packages-cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/ios/build/SnapshotDerivedData/SourcePackages
          key: ios-screenshot-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/ios/**/Package.resolved', 'apps/ios/project.yml', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}
      - name: Generate the normal iOS project
        run: pnpm ios:gen
      - name: Inspect baseline and disabled index settings without compiling
        run: |-
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/index-store-settings"
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          for variant in baseline disabled; do
            settings=(-showBuildSettings -json)
            if [[ "$variant" == disabled ]]; then settings+=(COMPILER_INDEX_STORE_ENABLE=NO); fi
            xcodebuild -project apps/ios/OpenClaw.xcodeproj -scheme OpenClawUITests -configuration Debug \
              -derivedDataPath apps/ios/build/SnapshotDerivedData -destination 'generic/platform=iOS Simulator' \
              "ARCHS=$(uname -m)" ONLY_ACTIVE_ARCH=YES "${settings[@]}" \
              > "$RUNNER_TEMP/index-store-settings/$variant.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const keys=['COMPILER_INDEX_STORE_ENABLE','INDEX_ENABLE_DATA_STORE','SWIFT_INDEX_STORE_ENABLE','CLANG_INDEX_STORE_ENABLE','SWIFT_OPTIMIZATION_LEVEL','GCC_OPTIMIZATION_LEVEL','INDEX_DATA_STORE_DIR'];
          for(const variant of ['baseline','disabled']) {
            const targets=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/index-store-settings/'+variant+'.json','utf8'));
            for(const target of targets) console.log(JSON.stringify({variant,target:target.target,settings:Object.fromEntries(keys.map(k=>[k,target.buildSettings[k]??null]))}));
          }
          NODE
      - name: Retain effective settings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-index-store-settings-${{ github.run_id }}
          path: ${{ runner.temp }}/index-store-settings
          if-no-files-found: error
          retention-days: 14
