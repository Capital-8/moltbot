                  checkout_environment.clear()


          def terminal_diagnostic(error, owner_code):
              # Code identity, not a filename supplied by policy, proves source provenance.
              codes = {id(owner_code): owner_code}
              pending = [owner_code]
              while pending:
                  for value in pending.pop().co_consts:
                      if type(value) is type(owner_code):
                          codes[id(value)] = value
                          pending.append(value)
              names = {value: value.__name__ for value in vars(builtins).values()
                       if isinstance(value, type) and issubclass(value, BaseException)}
              names.update({FetchTimeout: "FetchTimeout", GitFailure: "GitFailure"})
              records, seen, via = [], set(), "terminal"
              while error is not None and id(error) not in seen and len(records) < 4:
                  seen.add(id(error))
                  record = {"type": names.get(type(error), "unknown"), "via": via}
                  for field in ("errno", "winerror"):
                      value = getattr(error, field, None)
                      if type(value) is int and -(2 ** 31) <= value < 2 ** 32:
                          record[field] = value
                  frames, trace = [], error.__traceback__
                  # Bound traversal as well as output; malformed metadata cannot stall exit.
                  for _ in range(256):
                      if trace is None:
                          break
                      if type(trace) is not TracebackType:
                          raise TypeError
                      frame, code = trace.tb_frame, trace.tb_frame.f_code
                      if frame.f_globals is globals() and id(code) in codes and 0 < trace.tb_lineno < 2 ** 31:
                          frames.append({"function": code.co_name[:64], "line": trace.tb_lineno})
                          frames = frames[-6:]
                      trace = trace.tb_next
                  record["owner_frames"] = frames
                  if trace is not None:
                      record["traceback_truncated"] = 1
                  records.append(record)
                  cause = error.__cause__
                  error, via = (cause, "cause") if cause is not None else (error.__context__, "context")
              return records


          if __name__ == "__main__":
              exit_code, terminal_error = 0, None
              try:
                  main()
              except FetchTimeout:
                  exit_code = 124
              except GitFailure as error:
                  exit_code = error.code
              except Exception as error:
                  exit_code, terminal_error = 125, error
              # Leave the handler before diagnostics or exit can raise: older Python'\''s
              # implicit exception chaining can loop on an already-cyclic context.
              if terminal_error is not None:
                  name, diagnostic = "unknown", "unavailable"
                  try:
                      records = terminal_diagnostic(terminal_error, sys._getframe().f_code)
                      diagnostic = json.dumps(records, separators=(",", ":"))
                      name = records[0]["type"]
                  except BaseException:
                      pass  # Diagnostics must never replace the authoritative terminal exit.
                  try:
                      print(f"::error::Git ownership/setup failed ({name}); refusing reuse or retry", file=sys.stderr)
                      print(f"[ci-git-owner] diagnostic={diagnostic}", file=sys.stderr)
                  except BaseException:
                      pass
              raise SystemExit(exit_code)
          '
          # End generated CI Git owner.
      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8
        with:
          ruby-version: 4.0.7
          bundler: 4.0.23
          bundler-cache: false
          working-directory: apps/ios
      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          bundle _4.0.23_ install --jobs 4 --retry 3
          bundle _4.0.23_ check
          bundle _4.0.23_ exec fastlane --version
      - name: Select Xcode
        id: select-xcode
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
      - name: Setup Node environment
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: ${{ needs.preflight.outputs.cache_mode }}
          install-bun: "false"
          node-version: ${{ env.IOS_SCREENSHOT_NODE_VERSION }}
      - name: Install iOS screenshot tooling
        run: |
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          "$swift_tools_dir/xcodegen" --version
          "$swift_tools_dir/swiftformat" --version
          "$swift_tools_dir/swiftlint" version
      - name: Install Watch Rust toolchain
        id: watch-rust-toolchain
        if: env.HISTORICAL_TARGET != 'true' || hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
      - name: Identify iOS native cache inputs
        id: ios-cache-inputs
        if: env.HISTORICAL_TARGET != 'true' && needs.preflight.outputs.frozen_target != 'true' && hashFiles('apps/shared/OpenClawWatchRTC/build.sh') != ''
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-libraries" >> "$GITHUB_ENV"
      - name: Restore Watch RTC build inputs
        id: watch-rtc-cache
        if: steps.ios-cache-inputs.outputs.xcode != '' && needs.preflight.outputs.cache_mode != 'off'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/openclaw-watch-rtc-libraries
          key: watch-rtc-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}
      - name: Restore screenshot source packages
        id: ios-packages-cache
        if: steps.ios-cache-inputs.outputs.xcode != '' && needs.preflight.outputs.cache_mode != 'off'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/ios/build/SnapshotDerivedData/SourcePackages
          key: ios-screenshot-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/ios/**/Package.resolved', 'apps/ios/project.yml', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}
      - name: Capture iPhone, iPad, and Watch screenshots
        id: device_screenshots
        env:
          OPENCLAW_SNAPSHOT_DIAGNOSTICS: "1"
          OPENCLAW_INVENTORY_PROBE_DIRECTORY: ${{ runner.temp }}/ios-inventory-probe
        run: |
          node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-resource-timeline.jsonl" -- \
            pnpm ios:screenshots
      - name: Package iOS screenshot capture evidence
        id: package_screenshot_evidence
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: ${{ needs.preflight.outputs.checkout_revision }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          fastlane_version="$(
            source scripts/lib/ios-fastlane.sh
            run_ios_fastlane --version 2>&1 | awk 'match($0, /^fastlane [0-9]+\.[0-9]+\.[0-9]+$/) { print substr($0, RSTART + 9, RLENGTH - 9); exit }'
          )"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          test "$xcode_version" = "$IOS_SCREENSHOT_XCODE_VERSION"
          collect_args=(
            collect
            --screenshots apps/ios/fastlane/screenshots/en-US
            --xcresults apps/ios/build/SnapshotTestResults
            --output apps/ios/build/ScreenshotEvidenceCapture
            --target-sha "$TARGET_SHA"
            --workflow-sha "$WORKFLOW_SHA"
            --run-id "$RUN_ID"
            --run-attempt "$RUN_ATTEMPT"
            --xcode-version "$xcode_version"
            --fastlane-version "$fastlane_version"
            --node-version "$(node --version)"
          )
          node .ci-harness/scripts/ios-screenshot-evidence.mjs "${collect_args[@]}"
      - name: Upload iOS screenshot capture evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-release-screenshot-capture-${{ needs.preflight.outputs.checkout_revision }}
          path: apps/ios/build/ScreenshotEvidenceCapture/
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS screenshot timing diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-release-screenshot-diagnostics-${{ needs.preflight.outputs.checkout_revision }}
          path: |
            apps/ios/build/screenshot-diagnostics.json
            ${{ runner.temp }}/ios-resource-timeline.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failed iOS screenshot attempt evidence
        if: ${{ always() && (steps.device_screenshots.outcome == 'failure' || steps.package_screenshot_evidence.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-release-screenshot-failure-${{ needs.preflight.outputs.checkout_revision }}
          path: |
            apps/ios/fastlane/screenshots/en-US/*.png
            apps/ios/build/SnapshotTestResults/capture-attempts.json
            apps/ios/build/SnapshotTestResults/*.xcresult
            apps/ios/build/SnapshotLogs/*.log
            apps/ios/build/screenshot-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save screenshot source packages
        if: steps.ios-cache-inputs.outputs.xcode != '' && steps.ios-packages-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.cache_write_allowed == 'true' && needs.preflight.outputs.candidate_trust == 'main' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
        continue-on-error: true
        timeout-minutes: 3
