name: iOS Watch RTC archive-only comparison (temporary)
run-name: iOS Watch RTC archive-only comparison (5 cold + 5 cached)
on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
      mode:
        type: string
        default: stock
      resource_diagnostics:
        type: boolean
        default: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-watch-rtc-archive-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.22.1"
  ACCEPTANCE_RULE: "Five interleaved cold and warm archives of one SHA, fresh DerivedData; all ten succeed; cold runs compile both Watch device slices, warm runs verify both hits with zero Cargo builds; warm median including cache restore improves at least 5%, warm p95 regresses less than 20%; record spread and host pressure. No signing, export, or upload."
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27-xlarge
    timeout-minutes: 180
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          node-version: ${{ env.NODE_VERSION }}
      - name: Select pinned native tools
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          tools="$RUNNER_TEMP/ios-archive-tools"
          ./scripts/install-xcodegen.sh "$tools"
          ./scripts/install-swift-tools.sh "$tools"
          echo "$tools" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src
          cargo "+$toolchain" fetch --locked --manifest-path apps/shared/OpenClawWatchRTC/Cargo.toml
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-release-libraries" >> "$GITHUB_ENV"
      - name: Prepare canonical release project without signing
        run: |
          set -euo pipefail
          export GIT_COMMIT="$GITHUB_SHA"
          export OPENCLAW_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          bash scripts/ios-release-prepare.sh --version "$(node -p 'require("./package.json").version')" --revision 0 --build-number 1 --team-id FWJYW4S8P8
          echo "GIT_COMMIT=$GIT_COMMIT" >> "$GITHUB_ENV"
          echo "OPENCLAW_BUILD_TIMESTAMP=$OPENCLAW_BUILD_TIMESTAMP" >> "$GITHUB_ENV"
          echo "XCODE_XCCONFIG_FILE=$GITHUB_WORKSPACE/apps/ios/build/AppStoreRelease.xcconfig" >> "$GITHUB_ENV"
          node scripts/ios-watch-rtc-archive-proof.mjs prepare
      - name: Cold archive 1
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/cold-1-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample cold-1
      - name: Save proof device libraries
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-proof-v1-${{ github.run_id }}
      - name: Start cache restore timer 1
        run: |
          rm -rf "$RUNNER_TEMP/openclaw-watch-rtc-release-libraries"
          echo "CACHE_RESTORE_STARTED_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Restore proof device libraries 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-proof-v1-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Cached archive 1
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/warm-1-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample warm-1
      - name: Cold archive 2
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/cold-2-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample cold-2
      - name: Start cache restore timer 2
        run: |
          rm -rf "$RUNNER_TEMP/openclaw-watch-rtc-release-libraries"
          echo "CACHE_RESTORE_STARTED_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Restore proof device libraries 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-proof-v1-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Cached archive 2
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/warm-2-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample warm-2
      - name: Cold archive 3
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/cold-3-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample cold-3
      - name: Start cache restore timer 3
        run: |
          rm -rf "$RUNNER_TEMP/openclaw-watch-rtc-release-libraries"
          echo "CACHE_RESTORE_STARTED_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Restore proof device libraries 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-proof-v1-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Cached archive 3
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/warm-3-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample warm-3
      - name: Cold archive 4
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/cold-4-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample cold-4
      - name: Start cache restore timer 4
        run: |
          rm -rf "$RUNNER_TEMP/openclaw-watch-rtc-release-libraries"
          echo "CACHE_RESTORE_STARTED_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Restore proof device libraries 4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-proof-v1-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Cached archive 4
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/warm-4-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample warm-4
      - name: Cold archive 5
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/cold-5-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample cold-5
      - name: Start cache restore timer 5
        run: |
          rm -rf "$RUNNER_TEMP/openclaw-watch-rtc-release-libraries"
          echo "CACHE_RESTORE_STARTED_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Restore proof device libraries 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-proof-v1-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Cached archive 5
        run: |
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS=1 node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-watch-rtc-proof/warm-5-resources.jsonl" -- \
            node scripts/ios-watch-rtc-archive-proof.mjs sample warm-5
      - name: Compare measured archives
        if: always()
        run: node scripts/ios-watch-rtc-archive-proof.mjs report
      - name: Retain archive-only proof and resource evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-watch-rtc-archive-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-watch-rtc-proof
          if-no-files-found: error
          retention-days: 7
