name: TestFlight worktree performance proof
run-name: Nonpublishing TestFlight worktree comparison
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA containing the candidate mobile-release.mjs
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ios-testflight-worktree-proof
  cancel-in-progress: false
jobs:
  compare:
    runs-on: xcode-27-xlarge
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout diagnostic tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an immutable candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout baseline tooling outside measurement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 548649e1dc47e16b26cc415e03f3e810f9ef5a65
          path: baseline
          persist-credentials: false
      - name: Checkout candidate tooling outside measurement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Setup Node outside measurement
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          install-deps: "false"
      - name: Install frozen tooling dependencies outside measurement
        run: |
          pnpm --dir baseline install --frozen-lockfile --ignore-scripts
          pnpm --dir candidate install --frozen-lockfile --ignore-scripts
      - name: Compare five fresh checkout and real CLI pairs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/ios-testflight-worktree-proof.mjs
      - name: Retain every sample including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-testflight-worktree-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-testflight-worktree-proof/evidence
          if-no-files-found: error
          retention-days: 14
