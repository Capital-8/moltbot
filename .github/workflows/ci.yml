name: CI
run-name: Full iOS screenshot capture with renderer tracing (no upload)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: diagnostic-ios-screenshot-mermaid
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IOS_SCREENSHOT_FASTLANE_VERSION: 2.241.1
  IOS_SCREENSHOT_NODE_VERSION: 24.22.1
  IOS_SCREENSHOT_XCODE_VERSION: Xcode 27.1 Build version 27A9275
jobs:
  mermaid-capture:
    runs-on: xcode-27-xlarge
    timeout-minutes: 90
    env:
      HISTORICAL_TARGET: "false"
      BUNDLE_DEPLOYMENT: "true"
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ios/Gemfile
    steps:
      - name: Checkout frozen diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout matching CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .ci-harness
          sparse-checkout: |-
            .github
            scripts
      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8
        with:
          ruby-version: 4.0.7
          bundler: 4.0.23
          bundler-cache: false
          working-directory: apps/ios
      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          bundle _4.0.23_ install --jobs 4 --retry 3
          bundle _4.0.23_ check
          bundle _4.0.23_ exec fastlane --version
      - name: Select Xcode
        id: select-xcode
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
      - name: Setup Node environment
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
          node-version: ${{ env.IOS_SCREENSHOT_NODE_VERSION }}
      - name: Install iOS screenshot tooling
        run: |
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          "$swift_tools_dir/xcodegen" --version
          "$swift_tools_dir/swiftformat" --version
          "$swift_tools_dir/swiftlint" version
      - name: Install Watch Rust toolchain
        id: watch-rust-toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
      - name: Identify iOS native cache inputs
        id: ios-cache-inputs
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-libraries" >> "$GITHUB_ENV"
      - name: Restore Watch RTC build inputs
        id: watch-rtc-cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/openclaw-watch-rtc-libraries
          key: watch-rtc-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}
      - name: Restore screenshot source packages
        id: ios-packages-cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/ios/build/SnapshotDerivedData/SourcePackages
          key: ios-screenshot-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/ios/**/Package.resolved', 'apps/ios/project.yml', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}
      - name: Capture iPhone, iPad, and Watch screenshots with renderer tracing
        env:
          OPENCLAW_SNAPSHOT_DIAGNOSTICS: "1"
        run: |
          node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-mermaid-resources.jsonl" -- \
            /bin/bash scripts/ios-screenshots.sh
      - name: Retain targeted renderer and screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-mermaid-diagnostics-${{ github.run_id }}
          path: |
            apps/ios/build/SnapshotLogs
            apps/ios/build/SnapshotTestResults
            apps/ios/build/screenshot-diagnostics.json
            apps/ios/fastlane/screenshots/en-US/*.png
            ${{ runner.temp }}/ios-mermaid-resources.jsonl
          if-no-files-found: error
          retention-days: 14
