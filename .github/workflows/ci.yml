        id: checkout_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout trusted CI harness
        if: ${{ steps.checkout_ref.outputs.sha != github.workflow_sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /test/vitest/
            /config/ci-test-timings.json
            /node-runtime-env.mjs
            /runtime-process-scripts.generated.mjs
            /packages/normalization-core/src/stable-stringify.ts
            /src/infra/node-runtime-executable.ts
            /src/infra/runtime-process-manifest.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate CI qualification dispatch
        id: qualification_dispatch
        if: github.event_name == 'workflow_dispatch' && (inputs.runner_backend != 'default' || inputs.ci_shape == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GATE: ${{ inputs.release_gate }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          CI_SHAPE: ${{ inputs.ci_shape }}
          REQUESTED_RUNNER_PROFILE: ${{ inputs.runner_backend }}
          HISTORICAL_TARGET_TAG: ${{ inputs.historical_target_tag }}
          RELEASE_CANDIDATE_REF: ${{ inputs.release_candidate_ref }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "openclaw/openclaw" && "$RELEASE_GATE" == "true" && "$TARGET_REF" == "$WORKFLOW_REVISION" && "$TARGET_REF" == "$GITHUB_SHA" ]]
          [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ && "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ && "$RELEASE_SCOPE" == "full" ]]
          [[ -z "$HISTORICAL_TARGET_TAG$RELEASE_CANDIDATE_REF$TARGET_CONTEXT_REF" ]]
          case "$CI_SHAPE" in default | main) ;; *) exit 1 ;; esac
          case "$REQUESTED_RUNNER_PROFILE" in default | hybrid | runson) ;; *) exit 1 ;; esac
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)"
          case "$permission" in admin | maintain | write) ;; *) echo "CI qualification requires a repository maintainer" >&2; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
            --jq '{state,head:.head.sha,branch:.head.ref,repository:.head.repo.full_name,base:.base.ref,baseRepository:.base.repo.full_name}' > "$RUNNER_TEMP/qualification-pr.json"
          jq -e --arg sha "$TARGET_REF" --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
            '.state == "open" and .head == $sha and .branch == $branch and .repository == $repo and .baseRepository == $repo and .base == "main"' "$RUNNER_TEMP/qualification-pr.json"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Resolve logical runner profile
        id: runner_profile
        env:
          CONFIGURED_RUNNER_PROFILE: ${{ vars.OPENCLAW_CI_RUNNER_BACKEND }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REQUESTED_RUNNER_PROFILE: ${{ inputs.runner_backend || 'default' }}
          QUALIFICATION_DISPATCH: ${{ steps.qualification_dispatch.outputs.eligible || 'false' }}
          CI_SHAPE: ${{ inputs.ci_shape || 'default' }}
        shell: bash
        run: |
          set -euo pipefail
          runner_profile="${CONFIGURED_RUNNER_PROFILE:-blacksmith}"
          case "$runner_profile" in
            github | hybrid | blacksmith | runson) ;;
            *) echo "OPENCLAW_CI_RUNNER_BACKEND must be github, hybrid, blacksmith, or runson" >&2; exit 1 ;;
          esac
          ci_qualification=false
          ci_shape=default
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${QUALIFICATION_DISPATCH:-false}" == "true" ]]; then
            ci_qualification=true
            ci_shape="${CI_SHAPE:-default}"
            if [[ "${REQUESTED_RUNNER_PROFILE:-default}" != "default" ]]; then
              runner_profile="$REQUESTED_RUNNER_PROFILE"
            fi
          elif [[ "${REQUESTED_RUNNER_PROFILE:-default}" != "default" || "${CI_SHAPE:-default}" != "default" ]]; then
            echo "Runner and shape overrides require an admitted CI qualification" >&2
            exit 1
          fi
          runson_requested=false
          if [[ "$runner_profile" == "runson" || "${REQUESTED_RUNNER_PROFILE:-default}" == "runson" ]]; then
            runson_requested=true
            runner_profile=hybrid
          fi
          qualified_runner_profile="$runner_profile"
          hosted_runner_profile_contract=false
          grep -Fq "hosted-runner-profile-contract-v1" .github/workflows/ci.yml &&
            hosted_runner_profile_contract=true
          fork_pull_request=false
          [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]] &&
            fork_pull_request=true
          # Forks cannot mount the trusted sticky disks and caches that size the
          # all-in-one lint/type jobs, so their check jobs keep the hosted stripes.
          if [[
            "$hosted_runner_profile_contract" == "true" &&
            (
              "$GITHUB_EVENT_NAME" == "workflow_dispatch" ||
              "$GITHUB_REPOSITORY" != "openclaw/openclaw" ||
              "$fork_pull_request" == "true"
            )
          ]]; then
            runner_profile=github
          fi
          node_runner_backend="$runner_profile"
          # Plan fork first attempts for their available backend (Blacksmith when
          # repository variables are absent), independently of the author.
          # Fork retries route hosted because forks cannot read the backend override.
          if [[
            "$hosted_runner_profile_contract" == "true" &&
            "$fork_pull_request" == "true" &&
            "$GITHUB_REPOSITORY" == "openclaw/openclaw" &&
            "${GITHUB_RUN_ATTEMPT:-1}" == "1"
          ]]; then
            node_runner_backend="$qualified_runner_profile"
          fi
          qualification_runner_backend=
          if [[ "$ci_qualification" == "true" && "${GITHUB_RUN_ATTEMPT:-1}" == "1" ]]; then
            runner_profile="$qualified_runner_profile"
            node_runner_backend="$qualified_runner_profile"
            qualification_runner_backend="$qualified_runner_profile"
          fi
          # Ordinary pushes retain hybrid; only admitted qualification may opt in on a main shape.
          if [[ "$runson_requested" == "true" && "$GITHUB_REPOSITORY" == "openclaw/openclaw" && "${GITHUB_RUN_ATTEMPT:-1}" == "1" ]] &&
            grep -Fq "runson-runner-profile-contract-v1" .github/workflows/ci.yml &&
            [[ ( "$GITHUB_EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ) || "$ci_qualification" == "true" ]]; then
            runner_profile=hybrid
            node_runner_backend=runson
          fi
          printf '%s\n' \
            "hosted_runner_profile_contract=$hosted_runner_profile_contract" \
            "ci_qualification=$ci_qualification" \
            "ci_shape=$ci_shape" \
            "qualification_runner_backend=$qualification_runner_backend" \
            "runner_profile=$runner_profile" \
            "node_runner_backend=$node_runner_backend" >> "$GITHUB_OUTPUT"
      - name: Resolve exact diff base
        id: diff_base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          EVENT_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || '' }}
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_gate && github.token || '' }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          RELEASE_GATE: ${{ inputs.release_gate }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          head_sha="$(git rev-parse HEAD)"
          # Full scheduled validation has no change range. Pin the checkout itself
          # for consumers that require a protocol/lockfile comparison ref.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            base_sha="$head_sha"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$base_sha" =~ ^0+$ ]]; then
            echo "::error title=ambiguous main push::github.event.before is zero; refusing to infer a diff base for a created or recreated main branch." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A long-lived PR event can retain an old base SHA. The tested merge
            # commit's first parent is the exact target tree for this run.
            base_sha="$(node scripts/lib/merge-head-diff-base.mjs \
              --base "$base_sha" --head HEAD --prefer-first-parent)"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_GATE" != "true" ]; then
            # Qualification compares frozen inputs, not main after it advances.
            # Cross-revision diagnostics retain the immutable workflow/target merge base.
            if [[ "${DISPATCH_ID:-}" == full-release-validation-* && -n "${TARGET_CONTEXT_REF:-}" ]]; then
              default_sha="$WORKFLOW_REVISION"
            else
              encoded_ref="$(jq -rn --arg value "refs/heads/${DEFAULT_BRANCH}" '$value | @uri')"
              default_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
            fi
            if [[ ! "$default_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not resolve the default branch head for the manual target." >&2
              exit 1
            fi
            echo "default_sha=$default_sha" >> "$GITHUB_OUTPUT"
            if [[ "$default_sha" == "$head_sha" ]]; then
              base_sha="$head_sha"
            else
              base_sha="$(
                gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/compare/${default_sha}...${head_sha}" \
                  --jq '.merge_base_commit.sha'
              )"
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_GATE" = "true" ]; then
            merge_ref="refs/remotes/origin/release-gate-merge"
            python3 -I -S "$RUNNER_TEMP/ci-git-owner.py" --checkout-git 120 fetch \
              --no-tags --no-recurse-submodules --depth=2 origin \
              "+refs/pull/${PULL_REQUEST_NUMBER}/merge:${merge_ref}"
            release_gate_head="$(git rev-parse "${merge_ref}^2")"
            target_head="$(git rev-parse HEAD)"
            if [ "$release_gate_head" != "$target_head" ]; then
              echo "release_gate pull request head ${release_gate_head} does not match target ${target_head}" >&2
              exit 1
            fi
            base_sha="$(git rev-parse "${merge_ref}^1")"
            head_sha="$(git rev-parse "$merge_ref")"
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve an exact diff base for ${GITHUB_EVENT_NAME}." >&2
            exit 1
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve checkout comparison base
        id: checkout_base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.diff_base.outputs.sha }}
          DIFF_HEAD_SHA: ${{ steps.diff_base.outputs.head_sha }}
          CHECKOUT_SHA: ${{ steps.checkout_ref.outputs.sha }}
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$DIFF_HEAD_SHA" "$CHECKOUT_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Checkout comparison requires immutable base and head commits." >&2
              exit 1
            fi
          done
          comparison_base="$BASE_SHA"
          # Release-gate planning uses the merge tree, but lint executes the
          # candidate. Its grandfathered source belongs to the actual fork.
          if [[ "$CHECKOUT_SHA" != "$DIFF_HEAD_SHA" ]]; then
            comparison_base="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${CHECKOUT_SHA}" \
              --jq '.merge_base_commit.sha')"
          fi
          if [[ ! "$comparison_base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the checkout comparison ancestor." >&2
            exit 1
          fi
          echo "sha=$comparison_base" >> "$GITHUB_OUTPUT"
      - name: Validate historical release target
        id: historical_target
        if: inputs.historical_target_tag != ''
        env:
          EXPECTED_SHA: ${{ steps.checkout_ref.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          HISTORICAL_TARGET_TAG: ${{ inputs.historical_target_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$HISTORICAL_TARGET_TAG" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+((-(alpha|beta)\.[0-9]+)|(-[1-9][0-9]*))?$ ]]; then
            echo "historical_target_tag must be a canonical OpenClaw release tag." >&2
            exit 1
          fi
          encoded_ref="$(jq -rn --arg value "refs/tags/${HISTORICAL_TARGET_TAG}" '$value | @uri')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Historical release tag ${HISTORICAL_TARGET_TAG} does not resolve to ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Validate release candidate target
        id: release_candidate_target
        if: inputs.release_candidate_ref != ''
        env:
          EXPECTED_SHA: ${{ steps.checkout_ref.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE_REF: ${{ inputs.release_candidate_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_CANDIDATE_REF" =~ ^(release/[0-9]{4}\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?|extended-stable/[0-9]{4}\.[0-9]+\.33)$ ]]; then
            echo "release_candidate_ref must be a canonical OpenClaw release branch." >&2
            exit 1
          fi
          encoded_ref="$(jq -rn --arg value "refs/heads/${RELEASE_CANDIDATE_REF}" '$value | @uri')"
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
          if [[ "$branch_sha" != "$EXPECTED_SHA" ]]; then
            echo "Release candidate branch ${RELEASE_CANDIDATE_REF} does not resolve to ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Validate target context
        id: target_context_target
        if: inputs.target_context_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_CONTEXT_REF" =~ ^(release/[0-9]{4}\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?|extended-stable/[0-9]{4}\.[0-9]+\.33)$ ]]; then
            echo "target_context_ref must be a canonical OpenClaw release branch." >&2
            exit 1
          fi
          if [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_context_ref requires target_ref to be a full commit SHA." >&2
            exit 1
          fi
          encoded_ref="$(jq -rn --arg value "refs/heads/${TARGET_CONTEXT_REF}" '$value | @uri')"
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
          if [[ ! "$branch_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_context_ref branch ${TARGET_CONTEXT_REF} does not exist." >&2
            exit 1
          fi
          comparison_status="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${TARGET_REF}...${branch_sha}" --jq .status
          )"
          if [[ "$comparison_status" != "ahead" && "$comparison_status" != "identical" ]]; then
            echo "target_ref must be the declared release branch head or one of its ancestors." >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Setup manifest TypeScript runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve release correction base
        id: release_correction_base
        if: github.event_name == 'workflow_dispatch' && (inputs.release_scope == 'npm-beta' || inputs.release_scope == 'npm-stable')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_CONTEXT_REF: ${{ steps.target_context_target.outputs.eligible == 'true' && inputs.target_context_ref || steps.historical_target.outputs.eligible == 'true' && inputs.historical_target_tag || '' }}
        run: |
          # Keep the token outside the manifest step, which imports candidate-owned code.
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { resolveReleaseContextIdentity } from './.ci-harness/scripts/lib/release-context.mjs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const identity = resolveReleaseContextIdentity(process.env.TARGET_CONTEXT_REF, version);
          if (identity?.baseTag) {
            const ref = encodeURIComponent(`refs/tags/${identity.baseTag}`);
            const sha = execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/commits/${ref}`, '--jq', '.sha'], { encoding: 'utf8' }).trim();
            if (!/^[0-9a-f]{40}$/u.test(sha)) throw new Error(`Could not resolve correction base ${identity.baseTag}.`);
            appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          }
          NODE
      - name: Classify candidate cache trust
        id: candidate_trust
        env:
          CHECKOUT_REVISION: ${{ steps.checkout_ref.outputs.sha }}
          DEFAULT_SHA: ${{ steps.diff_base.outputs.default_sha }}
          HISTORICAL_TARGET: ${{ steps.historical_target.outputs.eligible || 'false' }}
          RELEASE_CANDIDATE_TARGET: ${{ steps.release_candidate_target.outputs.eligible || 'false' }}
          RELEASE_GATE: ${{ inputs.release_gate && 'true' || 'false' }}
          TARGET_CONTEXT_TARGET: ${{ steps.target_context_target.outputs.eligible || 'false' }}
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          trust=untrusted
          cache_mode=off
          cache_write_allowed=false

          if [[ ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "schedule" ) && "$GITHUB_REF" == "refs/heads/main" ]]; then
            trust=main
            cache_mode=restore
            cache_write_allowed=true
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            trust=pull-request
            cache_mode=restore
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_GATE" == "true" ]]; then
              trust=pull-request
              cache_mode=restore
            elif [[
              "$HISTORICAL_TARGET" == "true" ||
              "$RELEASE_CANDIDATE_TARGET" == "true" ||
              "$TARGET_CONTEXT_TARGET" == "true"
            ]]; then
              trust=release
              cache_mode=restore
              cache_write_allowed=true
            elif [[ -n "$DEFAULT_SHA" && "$CHECKOUT_REVISION" == "$DEFAULT_SHA" ]]; then
              trust=main
              cache_mode=restore
              cache_write_allowed=true
            elif [[
              ( -z "$TARGET_REF" || "$TARGET_REF" == "$WORKFLOW_REVISION" ) &&
              "$CHECKOUT_REVISION" == "$WORKFLOW_REVISION"
            ]]; then
              trust=workflow
              cache_mode=restore
            fi
          fi

          {
            echo "trust=$trust"
            echo "cache_mode=$cache_mode"
            echo "cache_write_allowed=$cache_write_allowed"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure preflight base commit
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: ./.ci-harness/.github/actions/ensure-base-commit
        with:
          base-sha: ${{ steps.diff_base.outputs.sha }}
          fetch-ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}
      - name: Detect docs-only changes
        id: docs_scope
        if: (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule') || steps.runner_profile.outputs.ci_qualification == 'true'
        uses: ./.ci-harness/.github/actions/detect-docs-changes
        with:
          base-sha: ${{ steps.diff_base.outputs.sha }}
      - name: Detect changed scopes
        id: changed_scope
        if: (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && steps.docs_scope.outputs.docs_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_gate)
        shell: bash
        env:
          OPENCLAW_ALLOW_RELEASE_GENERATED_MIX: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ steps.diff_base.outputs.sha }}"
            node scripts/ci-changed-scope.mjs --base "$BASE" --head HEAD
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ steps.diff_base.outputs.sha }}"
            node scripts/ci-changed-scope.mjs --base "$BASE" --head HEAD --merge-head-first-parent
          else
            BASE="${{ steps.diff_base.outputs.sha }}"
            HEAD_SHA="${{ steps.diff_base.outputs.head_sha }}"
            node scripts/ci-changed-scope.mjs --base "$BASE" --head "$HEAD_SHA"
          fi
      - name: Setup manifest pnpm
        if: github.event_name == 'workflow_dispatch' && steps.checkout_ref.outputs.sha != github.workflow_sha
        uses: ./.ci-harness/.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: ${{ steps.candidate_trust.outputs.cache_mode }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Install manifest dependencies
        if: github.event_name == 'workflow_dispatch' && steps.checkout_ref.outputs.sha != github.workflow_sha
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - name: Check hybrid hosted assignment health
        id: hosted_health
        if: contains(fromJSON('["hybrid","runson"]'), (steps.runner_profile.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && steps.runner_profile.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt == 1 && github.repository == 'openclaw/openclaw' && steps.changed_scope.outputs.run_node == 'true' && steps.changed_scope.outputs.run_node_fast_only != 'true' && (steps.qualification_dispatch.outputs.eligible == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && steps.changed_scope.outputs.run_windows == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from "node:fs";
          // Current PRs and validated exact-head qualification share this admission owner.
          import { inspectHybridHostedHealth } from "./scripts/lib/ci-hybrid-hosted-health.mts";
          const health = await inspectHybridHostedHealth({
            repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID,
            token: process.env.GH_TOKEN,
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `healthy=${health.healthy}\n`);
          const summary = `Hybrid hosted assignment: ${health.reason}; ${health.sampledJobs} sampled jobs, maximum wait ${health.maxWaitSeconds}s.`;
          console.log(health.healthy ? summary : `::warning::${summary} Retaining additional checks on Blacksmith.`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n\n`);
          EOF
      - name: Build CI manifest
        id: manifest
        env:
          OPENCLAW_CI_DOCS_ONLY: ${{ github.event_name == 'schedule' && 'false' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.docs_scope.outputs.docs_only }}
          OPENCLAW_CI_DOCS_CHANGED: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.docs_scope.outputs.docs_changed }}
