name: CI
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Optional branch, tag, or full commit SHA to validate instead of the workflow ref
        required: false
        default: ""
        type: string
      runner_backend:
        description: Runner qualification override; requires an exact-head canonical PR release_gate dispatch.
        required: false
        default: default
        type: choice
        options:
          - default
          - hybrid
          - runson
      ci_shape:
        description: Main-push coverage for an admitted exact-head qualification; default preserves ordinary dispatch behavior.
        required: false
        default: default
        type: choice
        options:
          - default
          - main
      test_runtime_policy:
        description: Linux test runtime override (node, bun-all, or dual-all); empty uses Bun for daily CI and both runtimes for full validation.
        required: false
        default: ""
        type: string
      capture_ui_proof:
        description: Capture and upload sanitized Control UI screenshots from real-Gateway tests.
        required: false
        default: false
        type: boolean
      include_android:
        description: Run Android lanes for this manual CI dispatch.
        required: false
        default: false
        type: boolean
      validation_tier:
        description: Full release coverage, or complete main coverage without release-only proofs.
        required: false
        default: full
        type: choice
        options:
          - full
          - main
      release_scope:
        description: Release qualification scope; npm-beta and npm-stable defer native apps for a validated exact release target.
        required: false
        default: full
        type: choice
        options:
          - full
          - npm-beta
          - npm-stable
      release_gate:
        description: Run an exact-SHA maintainer release-gate fallback when PR CI is capacity-stalled.
        required: false
        default: false
        type: boolean
      pull_request_number:
        description: Pull request number required by the exact-SHA release gate.
        required: false
        default: ""
        type: string
      qualification_baselines_json:
        description: Captured exact upgrade and survivor baselines from the qualification request
        required: false
        default: ""
        type: string
      dispatch_id:
        description: Optional parent workflow dispatch identifier
        required: false
        default: ""
        type: string
      historical_target_tag:
        description: Semver release tag authorizing compatibility fallbacks for its exact commit
        required: false
        default: ""
        type: string
      release_candidate_ref:
        description: Canonical release branch authorizing compatibility fallbacks for its exact head
        required: false
        default: ""
        type: string
      target_context_ref:
        description: Canonical release branch context authorizing compatibility fallbacks for an exact-SHA target
        required: false
        default: ""
        type: string
permissions:
  contents: read
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id != '' && format('CI {0}', inputs.dispatch_id) || (github.event_name == 'workflow_dispatch' && inputs.release_gate && format('CI release gate {0}', inputs.target_ref) || 'CI') }}
concurrency:
  group: |-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.draft &&
        github.event.action != 'converted_to_draft' && format('{0}-draft-v1-{1}', github.workflow, github.run_id) ||
        github.event_name == 'schedule' && format('{0}-hourly-main-v2-{1}', github.workflow, github.run_id) ||
        github.event_name == 'workflow_dispatch' && format('{0}-manual-v1-{1}', github.workflow, github.run_id) || (github.event_name == 'pull_request' && format('{0}-v7-{1}', github.workflow, github.event.pull_request.number) || (github.repository == 'openclaw/openclaw' && github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-v8-{1}-{2}', github.workflow, github.ref, (endsWith(format('{0}', github.run_number), '0') || endsWith(format('{0}', github.run_number), '2') || endsWith(format('{0}', github.run_number), '4') || endsWith(format('{0}', github.run_number), '6') || endsWith(format('{0}', github.run_number), '8')) && 'a' || 'b') || (github.repository == 'openclaw/openclaw' && format('{0}-v7-{1}', github.workflow, github.ref) || format('{0}-v7-{1}-{2}', github.workflow, github.ref, github.sha)))) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IOS_SCREENSHOT_FASTLANE_VERSION: 2.241.1
  IOS_SCREENSHOT_NODE_VERSION: 24.22.1
  IOS_SCREENSHOT_XCODE_VERSION: Xcode 27.1 Build version 27A9275
  NODE_VERSION: 24.22.1
  OPENCLAW_TYPECHECKER: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && 'tsgo' || '' }}
jobs:
  preflight:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: ${{ (github.event_name != 'schedule' || (github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main')) && ((github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.OPENCLAW_CI_ON_PUSH == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '') != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON((github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '')), toJSON((vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' || (vars.OPENCLAW_CI_RUNNER_BACKEND == 'hybrid' && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) || (contains(fromJSON('["hybrid","runson"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && github.run_attempt != 1)) && 'ubuntu-24.04' || (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04')))) || ((vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' || (vars.OPENCLAW_CI_RUNNER_BACKEND == 'hybrid' && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) || (contains(fromJSON('["hybrid","runson"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && github.run_attempt != 1)) && 'ubuntu-24.04' || (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04')) }}
    timeout-minutes: 20
    outputs:
      checkout_revision: ${{ steps.checkout_ref.outputs.sha }}
      candidate_trust: ${{ steps.candidate_trust.outputs.trust }}
      cache_mode: ${{ steps.candidate_trust.outputs.cache_mode }}
      cache_write_allowed: ${{ steps.candidate_trust.outputs.cache_write_allowed }}
      hosted_runner_profile_contract: ${{ steps.runner_profile.outputs.hosted_runner_profile_contract }}
